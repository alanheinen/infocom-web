# Set your hostname, class and TLS. Sign-in sends passwords, so serve it over
# HTTPS (this assumes cert-manager with a letsencrypt-prod ClusterIssuer).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infocom
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - infocom.example.com
      secretName: infocom-tls
  rules:
    - host: infocom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infocom
                port:
                  number: 80

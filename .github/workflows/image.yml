# Builds the container image, smoke-tests it, gates it on Trivy, and on main
# pushes it to ghcr.io/alanheinen/infocom-web with an SBOM and BuildKit
# provenance.
#
# Actions are pinned to commit SHAs because this pushes images people run.
# Tags: sha-<commit> for every main build (pin these, or the digest, for
# deployments that must not change under you) and latest.
name: image

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alanheinen/infocom-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check
        run: python3 -m py_compile server/*.py tests/*.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: infocom-web:ci

      - name: Smoke test (read-only, non-root, plays Zork I end to end)
        run: |
          set -euo pipefail
          docker run -d --name smoke --read-only --tmpfs /tmp --tmpfs /data:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 infocom-web:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null localhost:8080/
          python3 tests/smoke.py http://127.0.0.1:8080
          docker logs smoke | tail -5
          docker rm -f smoke

      - name: Trivy gate (fixable CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: infocom-web:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push with SBOM and provenance
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          sbom: true
          provenance: mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="${IMAGE}:sha-${GITHUB_SHA}@${DIGEST}"
          echo "Pushed \`${ref}\` (also tagged latest)." >> "$GITHUB_STEP_SUMMARY"
          echo "$ref"
